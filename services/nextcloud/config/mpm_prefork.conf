# Prefork MPM sized for a container. Peak RAM is roughly
# APACHE_MAX_REQUEST_WORKERS x PHP worker size (60-120 MB for Nextcloud), so raise
# it together with the service memory. Values come from environment variables
# (defaults in the Dockerfile).
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          2
    MaxSpareServers          6
    ServerLimit              ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers        ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild   ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
