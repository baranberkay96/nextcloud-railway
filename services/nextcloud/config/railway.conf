# Railway-specific Apache settings for Nextcloud.
ServerName localhost
ServerTokens Prod
ServerSignature Off

# Railway's edge proxy connects from private/CGNAT addresses. The image already
# trusts 10/8, 172.16/12 and 192.168/16 for X-Real-IP; add Railway's ranges so
# Apache logs and Nextcloud's brute-force protection see the client address.
RemoteIPInternalProxy 100.64.0.0/10
RemoteIPInternalProxy fd00::/8
